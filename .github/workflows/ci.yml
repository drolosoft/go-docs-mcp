name: CI

# Pushes to main and every pull request. Feature branches are covered by
# their pull request, so they do not run twice.
on:
  push:
    branches: [main]
  pull_request:
  # A weekly run, Monday 06:00 UTC, so a new mcp-go release that breaks one
  # of the protocol eras is found by the radar job below, not by whoever
  # bumps go.mod next. It can also be started by hand.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go version comes from go.mod, so CI never drifts from the
      # toolchain the module declares. setup-go caches the module and build
      # caches keyed by go.sum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Without these binaries the reader tests skip themselves, and CI would
      # pass without ever running pdftotext, tesseract or pandoc.
      # Ubuntu's pandoc package has no xlsx or pptx reader, so pandoc comes
      # from the upstream .deb instead; the version is pinned on purpose.
      - name: Install poppler, tesseract and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-eng
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Fmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      # govulncheck fails only on vulnerabilities the code can reach. A known
      # advisory in a required module that go-docs-mcp never calls (see
      # CHANGELOG) is reported but does not fail the job.
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The author develops on macOS and the reader looks for the binaries in
      # the Homebrew prefixes, so this job proves that lookup on a real Mac.
      # Skipping brew's auto-update saves a couple of minutes per run.
      - name: Install poppler, tesseract and pandoc
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install poppler tesseract pandoc

      - name: Test
        run: go test -race ./...

  # There is no floor job. go.mod pins the exact mcp-go version and Go builds
  # with that version and no other, so the floor and the ceiling are the same
  # module, and the linux and macos jobs already test it.
  #
  # Early warning only: the server serves both MCP protocol eras (the legacy
  # initialize handshake and the stateless 2026-07-28 one), and these tests
  # pin both on the wire. This job tries them against the newest mcp-go, so a
  # release that breaks an era shows up before anyone bumps go.mod. It commits
  # nothing and never blocks anything.
  next-sdk-radar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The upgrade only lives in this runner's checkout; go.mod in the
      # repository stays where it is.
      - name: Move to the newest mcp-go
        run: |
          go get github.com/mark3labs/mcp-go@latest
          go mod tidy

      # Name the resolved SDK in the log so a scheduled failure points at the
      # culprit release straight away.
      - name: Show resolved mcp-go
        run: go list -m github.com/mark3labs/mcp-go

      # The core cases of these tests touch only Markdown and plain text, so
      # poppler, tesseract and pandoc are not installed here.
      - name: Era tests against the newest mcp-go
        run: go test . -run 'TestRawWire|TestLegacyHandshakeClient|TestModernPinnedClient|TestAutoNegotiatingClient' -count=1
