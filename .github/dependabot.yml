version: 2
updates:
  # Go modules. The prefix matches the existing history ("chore(deps): ...").
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  # Actions used by the workflows in .github/workflows. They are grouped in
  # one pull request a week, because they rarely break each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
