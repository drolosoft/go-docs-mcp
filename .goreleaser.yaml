version: 2

project_name: go-docs-mcp

builds:
  - id: go-docs-mcp
    main: .
    binary: go-docs-mcp
    # A pure Go binary: poppler, tesseract and pandoc are separate programs
    # found at run time, so nothing needs cgo and cross-compiling is safe.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Windows on ARM has no poppler or tesseract builds worth targeting yet.
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # No -X here: the server reads its version from the module build info,
    # which Go stamps from the git tag when the tree is clean.
    ldflags:
      - -s -w
    # The commit time instead of the build time, so two builds of the same
    # tag produce the same files.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Packs the Claude Desktop bundle (.mcpb) from the binaries above, before the
# checksums are taken. GoReleaser OSS has no global after hook (it is a Pro
# feature) and extra_files are only collected, never made, so this borrows the
# one step that runs a command between the build and the checksums: an SBOM
# entry with artifacts "any". What it declares in documents is added to the
# release and to checksums.txt like any other asset, so no extra_files entry
# is needed. It is not an SBOM; the id says what it is.
sboms:
  - id: mcpb
    artifacts: any
    cmd: ../scripts/pack-mcpb.sh
    args:
      - "."
      - "{{ .Version }}"
      - "$document"
    documents:
      - "{{ .ProjectName }}_{{ .Version }}.mcpb"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release notes come from CHANGELOG.md (the release workflow extracts the
# section of the tag and passes it with --release-notes), not from the commit
# list.
changelog:
  disable: true

release:
  github:
    owner: drolosoft
    name: go-docs-mcp
